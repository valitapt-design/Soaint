<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotación activa por mes</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body {font-family:Arial,sans-serif;margin:0;background:#fff;color:#222}
.wrap {max-width:1200px;margin:30px auto;padding:0 24px}
h1 {font-size:25px;margin-bottom:6px}
.sub {color:#666;margin-bottom:20px}
#chart {width:100%;height:560px}
#detail {margin-top:18px;padding:18px 22px;border:1px solid #ddd;border-radius:10px;background:#fafafa}
.summary {font-size:17px;margin-bottom:16px}
.summary strong:first-child {font-size:20px}
.table-wrap {overflow-x:auto}
table {width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th,td {border:1px solid #ddd;padding:9px 10px;text-align:left;vertical-align:top}
th {font-weight:700;background:#f1f1f1}
.empty {color:#666;padding:10px 0}
.hint {color:#666;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Dotación activa por mes</h1>
<div class="sub">Una sola línea. Haz clic en cualquier punto para ver Activos, No activos, Observaciones y Solicitado por.</div>
<div id="chart"></div>
<div id="detail"><div class="empty"><strong>Selecciona un punto</strong><br>El detalle del mes aparecerá aquí.</div></div>
<div class="hint">También puedes pasar el cursor sobre un punto para ver el detalle rápido.</div>
</div>
<script>
const months=["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre"];
const active=[57, 52, 61, 60, 62, 61, 57, 54, 55];
const inactive=[0, 5, 0, 1, 2, 1, 1, 1, 1];
const counts={"Enero": {"Activo": 57, "No Activo": 0}, "Febrero": {"Activo": 52, "No Activo": 5}, "Marzo": {"Activo": 61, "No Activo": 0}, "Abril": {"Activo": 60, "No Activo": 1}, "Mayo": {"Activo": 62, "No Activo": 2}, "Junio": {"Activo": 61, "No Activo": 1}, "Julio": {"Activo": 57, "No Activo": 1}, "Agosto": {"Activo": 54, "No Activo": 1}, "Septiembre": {"Activo": 55, "No Activo": 1}};
const details={"Enero": [], "Febrero": [{"Nombre": "Elizabeth   Alejandra González González", "Estado": "No Activo", "Observaciones": "Internalizado a partir de Febrero -  Se pierde Cupo", "Solicitado por": ""}, {"Nombre": "Ronald campos", "Estado": "No Activo", "Observaciones": "Internalizado a partir de Febrero -  Se pierde Cupo", "Solicitado por": ""}, {"Nombre": "Ignacio Andrés   Rodríguez Chandía", "Estado": "No Activo", "Observaciones": "Renuncia 30.01", "Solicitado por": ""}, {"Nombre": "Jorge   Francisco Méndez Valdés", "Estado": "No Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Julia Lozada   Flora", "Estado": "No Activo", "Observaciones": "Internalizado a partir de Febrero -  Se pierde Cupo", "Solicitado por": ""}], "Marzo": [{"Nombre": "Katherine   Lissette Arriagada Ulloa", "Estado": "Activo", "Observaciones": "Renuncia 17.03", "Solicitado por": ""}], "Abril": [{"Nombre": "Leonardo   Andrés López Lara", "Estado": "No Activo", "Observaciones": "Se solicita salida a partir 01.04", "Solicitado por": "Jonathan Sepúlveda Jefe Depto. Arquitectura"}], "Mayo": [{"Nombre": "Alejandro   Gastón Hornsby Martínez", "Estado": "No Activo", "Observaciones": "Internalizado por el cliente", "Solicitado por": ""}, {"Nombre": "Felipe   Cespedes", "Estado": "Activo", "Observaciones": "Se solicita salida a partir 15.05", "Solicitado por": "Juan Arango Jefe Depto. Desarrollo Digital"}, {"Nombre": "Mateo Espinoza", "Estado": "No Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}], "Junio": [{"Nombre": "Alexis Darío   Suitt López", "Estado": "Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Felipe   San Martin", "Estado": "Activo", "Observaciones": "Renuncia 15.06", "Solicitado por": ""}, {"Nombre": "Jaime   Guillermo Hernández Cuevas", "Estado": "Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Jorge Sebastián Muñoz Gómez", "Estado": "Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Mauricio Rivas", "Estado": "No Activo", "Observaciones": "Se solicita salida por el cliente a partir 01.06", "Solicitado por": "Francisca Campos Jefe Depto. DevOps"}], "Julio": [{"Nombre": "Cristian   Manuel Muñoz Saldaña", "Estado": "Activo", "Observaciones": "Renuncia 13.07", "Solicitado por": ""}, {"Nombre": "Pablo José   Bravo Cares", "Estado": "Activo", "Observaciones": "Renuncia 15.07", "Solicitado por": ""}, {"Nombre": "Alejandro Antonio Fernández   Varas", "Estado": "No Activo", "Observaciones": "Renuncia 30.06", "Solicitado por": ""}], "Agosto": [{"Nombre": "René Andrés Olivo Silva", "Estado": "No Activo", "Observaciones": "Renuncia 30.07", "Solicitado por": ""}], "Septiembre": [{"Nombre": "Andrés Matías   Navarro Silva", "Estado": "Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Luis Alexis Cruz Toledo", "Estado": "Activo", "Observaciones": "Término de asignación", "Solicitado por": ""}, {"Nombre": "Ninoska   Solange Espínola Rojas", "Estado": "No Activo", "Observaciones": "Renuncia 01.09", "Solicitado por": ""}, {"Nombre": "Cesar Dely", "Estado": "Activo", "Observaciones": "Se solicita salida por el cliente a partir 11.09", "Solicitado por": "Francisca Campos Jefe Depto. DevOps"}]};

const trace={
 x:months,y:active,mode:'lines+markers',name:'Profesionales activos',
 line:{width:3},marker:{size:10},
 customdata:months.map(m=>[counts[m]['Activo'],counts[m]['No Activo']]),
 hovertemplate:'<b>%{x}</b><br>Activos: %{customdata[0]}<br>No activos: %{customdata[1]}<extra></extra>'
};
const layout={
 margin:{l:60,r:30,t:25,b:60},
 xaxis:{title:'Mes'},
 yaxis:{title:'Cantidad de profesionales',rangemode:'tozero',dtick:5},
 hovermode:'closest',showlegend:false
};
Plotly.newPlot('chart',[trace],layout,{responsive:true,displayModeBar:false});

function renderDetail(month){
 const c=counts[month], d=details[month];
 let table='';
 if(d.length){
   const rows=d.map(r=>`<tr>
      <td>${r['Nombre']}</td>
      <td>${r['Estado']}</td>
      <td>${r['Observaciones'] || '—'}</td>
      <td>${r['Solicitado por'] || '—'}</td>
   </tr>`).join('');
   table=`<div class="table-wrap"><table>
     <thead><tr><th>Profesional</th><th>Estado</th><th>Observaciones</th><th>Solicitado por</th></tr></thead>
     <tbody>${rows}</tbody>
   </table></div>`;
 } else {
   table='<div class="empty">No hay observaciones ni solicitante registrados para este mes.</div>';
 }
 document.getElementById('detail').innerHTML=
   `<div class="summary"><strong>${month}</strong><br>
    Activos: <b>${c['Activo']}</b> &nbsp;&nbsp; | &nbsp;&nbsp;
    No activos: <b>${c['No Activo']}</b></div>`+table;
}
document.getElementById('chart').on('plotly_click',e=>renderDetail(e.points[0].x));
</script>
</body>
</html>
